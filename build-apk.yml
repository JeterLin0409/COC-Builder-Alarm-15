name: Build Android APK v1.5
on:
  workflow_dispatch:
  push:
    branches: [ main, master ]
jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'
      - name: Verify sources are really v1.5
        run: python3 scripts/verify_version.py
      - name: Install Android SDK 35
        run: sdkmanager 'platforms;android-35' 'build-tools;35.0.0'
      - name: Run unit tests and build debug APK
        run: gradle --no-daemon --stacktrace testDebugUnitTest assembleDebug
      - name: Write version marker
        run: |
          echo 'COC 建築鬧鐘 v1.5 (versionCode 6)' > APK_VERSION.txt
          sha256sum app/build/outputs/apk/debug/app-debug.apk >> APK_VERSION.txt
      - uses: actions/upload-artifact@v4
        with:
          name: COC-Builder-Alarm-v1.5-APK
          path: |
            app/build/outputs/apk/debug/app-debug.apk
            APK_VERSION.txt
          if-no-files-found: error
