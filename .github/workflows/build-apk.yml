name: Build Android APK v1.6 (Parser Fix)
on:
  workflow_dispatch:
  push:
    branches: [ main, master ]
jobs:
  build:
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Set up Gradle 8.7
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'
      - name: Verify source version
        run: python3 scripts/verify_version.py
      - name: Verify preinstalled Android SDK 35
        shell: bash
        run: |
          echo "Android SDK path: ${ANDROID_HOME:-not configured}"
          test -n "${ANDROID_HOME:-}"
          test -f "$ANDROID_HOME/platforms/android-35/android.jar"
          test -d "$ANDROID_HOME/build-tools/35.0.0"
          echo "PASS: preinstalled Android SDK 35 + Build Tools 35.0.0 found"
      - name: Run unit tests and build debug APK
        run: gradle --no-daemon --stacktrace testDebugUnitTest assembleDebug
      - name: Write version marker
        run: |
          echo 'COC 建築鬧鐘 v1.6 (versionCode 7)' > APK_VERSION.txt
          sha256sum app/build/outputs/apk/debug/app-debug.apk >> APK_VERSION.txt
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: COC-Builder-Alarm-v1.6-ParserFix-APK
          path: |
            app/build/outputs/apk/debug/app-debug.apk
            APK_VERSION.txt
          if-no-files-found: error
